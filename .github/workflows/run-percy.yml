name: Run Percy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-311-percy:
    name: Run Percy
    runs-on: ubuntu-latest
    env:
      PERCY_ENABLED: "True"
      PERCY_PROJECT: plotly/plotly.py
      PERCY_TOKEN: ${{ secrets.PERCY_PYTHON_TOKEN_V0 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          install-chromedriver: true
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Install requirements
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev_optional
      - name: Build HTML figures (Pandas 2)
        run: |
          source .venv/bin/activate
          python tests/percy/plotly-express.py
      - name: Run percy snapshots
        run: |
          npm i @percy/cli
          npx percy snapshot -c tests/percy/snapshots.yml tests/percy/
          rm tests/percy/*.html
